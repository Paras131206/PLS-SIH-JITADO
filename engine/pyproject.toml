[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apaar_engine"
version = "0.1.0"
description = "APAAR-SDMS Data & Intelligence Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Team A (Data & Intelligence)" }
]
dependencies = [
    "pydantic>=2.5.0",
    "pandas>=2.1.0",
    "pyyaml>=6.0.0",
    "openpyxl>=3.1.0",
    "rapidfuzz>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["apaar_engine"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
